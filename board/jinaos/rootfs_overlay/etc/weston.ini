[core]
shell=desktop-shell.so
backend=drm-backend.so
idle-time=0

[shell]
panel-location=bottom
panel-position=center
locking=false
background-color=0xff2e7d32
panel-color=0xff1b5e20

[output]
name=DSI-1
mode=720x1280
transform=rotate-90
scale=1

[input]
touchscreen-enabled=true
calibrator=false

[keyboard]
keymap-layout=us
keymap-variant=standard

[launcher]
path=/usr/bin/bash
icon=/usr/share/icons/hicolor/48x48/apps/terminal.png

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/jpm.png
path=/usr/bin/jpm-gui

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/settings.png
path=/usr/bin/jpm-settings