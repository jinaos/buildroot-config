[main]
font=monospace:size=12
font-size-adjustment=0
term=xterm-256color

[mouse]
hide-when-typing=yes

[cursor]
style=block
blink=no

[scrollback]
lines=10000

[colors]
background=1e1e2e
foreground=cdd6f4
selection-background=585b70
selection-foreground=cdd6f4

[colors.bright]
black=585b70
red=f38ba8
green=a6e3a1
yellow=f9e2af
blue=89b4fa
magenta=cba6f7
cyan=94e2d5
white=ffffff